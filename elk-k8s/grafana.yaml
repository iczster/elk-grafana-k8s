# ---------------------------------------------------------
# Grafana (with provisioning + default dashboard)
# ---------------------------------------------------------
# Grafana Datasource
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: elk
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Elasticsearch
        type: elasticsearch
        access: proxy
        url: http://elasticsearch:9200
        isDefault: true
        jsonData:
          timeField: "@timestamp"
---
# Grafana Dashboard Config Map (Add dashboard JSON here to auto provision)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: elk
data:
  metrics-dashboard.json: |
    {
      "id": null,
      "uid": "per-second-stat",
      "title": "Real Time CPU Utilisation (Stat)",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "1s",
      "time": {
        "from": "now-5m",
        "to": "now"
      },
      "panels": [
        {
          "type": "stat",
          "title": "Real Time CPU Utilisation",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 12 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 0,
              "displayName": "CPU (%)",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "value": null, "color": "green" },
                  { "value": 60, "color": "blue" },
                  { "value": 80, "color": "orange" },
                  { "value": 90, "color": "red" }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "elasticsearch", "uid": "Elasticsearch" },
              "timeField": "@timestamp",
              "query": "*",
              "metrics": [
                {
                  "id": "1",
                  "type": "avg",
                  "field": "metric",
                  "alias": "CPU"
                }
              ],
              "bucketAggs": [
                {
                  "id": "2",
                  "type": "date_histogram",
                  "field": "@timestamp",
                  "settings": { "interval": "1s" }
                }
              ]
            }
          ]
        }
      ]
    }
---
# Grafana Service Provisioning
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: elk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:12.2.1
        ports:
          - containerPort: 3000
        env:
          - name: GF_SECURITY_ADMIN_USER
            value: admin
          - name: GF_SECURITY_ADMIN_PASSWORD
            value: admin
        volumeMounts:
          - name: grafana-datasource
            mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
            subPath: datasource.yaml
          - name: grafana-dashboard-provider
            mountPath: /etc/grafana/provisioning/dashboards/dashboard-provider.yaml
            subPath: dashboard-provider.yaml
          - name: grafana-dashboards
            mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: grafana-datasource
          configMap:
            name: grafana-datasource
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: elk
spec:
  selector:
    app: grafana
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001
