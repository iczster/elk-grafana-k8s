# -------------------- full-stack-deployment.yaml --------------------
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: elk
---
# Elasticsearch
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: elk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
        ports:
          - containerPort: 9200
        env:
          - name: discovery.type
            value: single-node
          - name: xpack.security.enabled
            value: "false"
          - name: xpack.security.http.ssl.enabled
            value: "false"
          - name: xpack.security.transport.ssl.enabled
            value: "false"
          - name: ES_JAVA_OPTS
            value: "-Xms512m -Xmx512m"
        volumeMounts:
          - name: es-data
            mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: es-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: elk
spec:
  selector:
    app: elasticsearch
  type: NodePort
  ports:
    - port: 9200
      targetPort: 9200
      nodePort: 30200
---
# Logstash Pipeline Config (UPDATED)
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
  namespace: elk
data:
  logstash.conf: |
    input {
      http {
        port => 5044
        codec => json
      }
    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "metrics-%{+YYYY.MM.dd}"
      }
      stdout { codec => rubydebug }
    }
---
# Logstash
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: elk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
      - name: logstash
        image: docker.elastic.co/logstash/logstash:8.14.0
        ports:
          - containerPort: 5044
        volumeMounts:
          - name: logstash-pipeline
            mountPath: /usr/share/logstash/pipeline
      volumes:
        - name: logstash-pipeline
          configMap:
            name: logstash-pipeline
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: elk
spec:
  type: ClusterIP
  selector:
    app: logstash
  ports:
    - port: 5044
      targetPort: 5044
---
# Kibana
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: elk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:8.14.0
        ports:
          - containerPort: 5601
        env:
          - name: ELASTICSEARCH_HOSTS
            value: "http://elasticsearch:9200"
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: elk
spec:
  selector:
    app: kibana
  type: NodePort
  ports:
    - port: 5601
      targetPort: 5601
      nodePort: 30002
---
# Grafana Datasource
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: elk
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Elasticsearch
        type: elasticsearch
        access: proxy
        url: http://elasticsearch:9200
        isDefault: true
        jsonData:
          timeField: "@timestamp"
---
# Grafana Dashboard Provider
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: elk
data:
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        folder: ''
        type: file
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
# Grafana Dashboards (unchanged — your dashboard JSON stays intact)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: elk
data:
  metrics-dashboard.json: |
    {
      "id": null,
      "uid": "per-second-metrics",
      "title": "Real Time CPU Utilisation (per second)",
      "schemaVersion": 36,
      "version": 2,
      "refresh": "1s",
      "time": {
        "from": "now-5m",
        "to": "now"
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Real Time CPU Utilisation",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "displayName": "CPU (%) Per Second"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "elasticsearch", "uid": "Elasticsearch" },
              "timeField": "@timestamp",
              "query": "*",
              "metrics": [
                {
                  "id": "1",
                  "type": "avg",
                  "field": "metric",
                  "alias": "Real Time CPU Utilisation"
                }
              ],
              "bucketAggs": [
                {
                  "id": "2",
                  "type": "date_histogram",
                  "field": "@timestamp",
                  "settings": { "interval": "1s" }
                }
              ]
            }
          ]
        }
      ]
    }
---
# Grafana
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: elk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.0.0
        ports:
          - containerPort: 3000
        env:
          - name: GF_SECURITY_ADMIN_USER
            value: admin
          - name: GF_SECURITY_ADMIN_PASSWORD
            value: admin
        volumeMounts:
          - name: grafana-datasource
            mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
            subPath: datasource.yaml
          - name: grafana-dashboard-provider
            mountPath: /etc/grafana/provisioning/dashboards/dashboard-provider.yaml
            subPath: dashboard-provider.yaml
          - name: grafana-dashboards
            mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: grafana-datasource
          configMap:
            name: grafana-datasource
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: elk
spec:
  selector:
    app: grafana
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001
---
# Metrics Generator (UPDATED)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-generator
  namespace: elk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-generator
  template:
    metadata:
      labels:
        app: metrics-generator
    spec:
      containers:
      - name: metrics-generator
        image: curlimages/curl:8.4.0
        command:
          - /bin/sh
          - -c
          - |
            while true; do
              TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ");
              VALUE=$((RANDOM % 100));
              curl -s -XPOST http://logstash:5044 \
                -H "Content-Type: application/json" \
                -d "{\"@timestamp\":\"$TS\", \"metric\":$VALUE}";
              sleep 1;
            done
